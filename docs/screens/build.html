<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build — Forge</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .buildwrap { display: grid; grid-template-columns: 1fr 268px; gap: 30px; align-items: start; }
  .steps { position: sticky; top: 22px; }
  .step { display: flex; gap: 10px; padding: 9px 0; font-size: 13px; }
  .step .n {
    width: 20px; height: 20px; border-radius: 50%; flex: 0 0 20px;
    display: grid; place-items: center; font-size: 10.5px; font-weight: 700;
    background: var(--surface-2); color: var(--faint); border: 1px solid var(--border);
  }
  .step.done .n { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
  .step.now  .n { background: var(--ink); color: #fdfdfc; border-color: transparent; }
  .step .lb { font-weight: 550; }
  .step .sd { color: var(--faint); font-size: 11.5px; }
  .step.todo .lb { color: var(--faint); font-weight: 500; }
  @media (max-width: 980px) { .buildwrap { grid-template-columns: 1fr; } .steps { position: static; } }
</style>
</head>
<body>
<div class="mockbar" id="mockbar"></div>
<div class="app">
  <nav class="sidebar" id="sidebar"></nav>
  <div class="main" id="main"></div>
</div>

<script src="../assets/data.js"></script>
<script src="../assets/app.js"></script>
<script>
Forge.shell("build", { build: "The heart of the capstone. A graph with two pauses that survives a restart." });

const steps = [
  { s: "done", n: "✓", lb: "Understand",       sd: "Work out what it should do" },
  { s: "done", n: "✓", lb: "Pick tools",       sd: "Search the registry, ask the user" },
  { s: "done", n: "✓", lb: "Check connections",sd: "Stop if a credential is missing" },
  { s: "now",  n: "4", lb: "Build and deploy", sd: "Write the config, create the agent" }
];

document.getElementById("main").innerHTML =
  Forge.topbar(
    "Build an agent",
    "Describe what you want. Switch to a form if you would rather fill fields in.",
    `<button class="btn">Use a form instead</button>`
  ) +
  `<div class="content">
   <div class="buildwrap">
    <div>
     <div class="chat">

      <!-- 1 -->
      <div class="msg user">
        <div class="body">I want an agent that reads my open GitHub issues every morning and posts a
        summary to Slack.</div>
      </div>

      <!-- 2 -->
      <div class="msg bot">
        <div class="who-av">F</div>
        <div class="body">
          <p>Got it. Here's what I think you're after:</p>
          <p><b>Issue Digest</b> — pulls open issues from a repository, sorts them by severity, and
          posts a short digest to a Slack channel on a weekday morning schedule.</p>
          <p>Two jobs really — classifying and writing — so I'll make it a coordinator with two
          specialists rather than one agent doing both.</p>
        </div>
      </div>

      <!-- interrupt 1 -->
      <div class="msg bot">
        <div class="who-av">F</div>
        <div class="body" style="width:100%">
          <p>I searched your registry. These servers cover it — which should it use?</p>
          <div class="interrupt">
            <div class="ihead"><span>Paused · waiting for you</span><span>interrupt: select_tools</span></div>
            <div class="ibody">
              <div class="pick on">
                <div class="box">✓</div>
                <div>
                  <div class="t">github <span class="badge ok"><span class="dot"></span>connected</span></div>
                  <div class="d">list_issues, get_issue &mdash; both read-only</div>
                </div>
              </div>
              <div class="pick on">
                <div class="box">✓</div>
                <div>
                  <div class="t">slack <span class="badge danger">not connected</span></div>
                  <div class="d">post_message &mdash; <b>write</b>, so it will ask you before posting</div>
                </div>
              </div>
              <div class="pick">
                <div class="box"></div>
                <div>
                  <div class="t">jira</div>
                  <div class="d">search_issues, create_issue &mdash; probably not needed here</div>
                </div>
              </div>
              <div class="row" style="margin-top:12px">
                <button class="btn primary sm">Use these 2</button>
                <span class="faint" style="font-size:12px">The build waits here until you answer.</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 3 -->
      <div class="msg user"><div class="body">Those two are right.</div></div>

      <!-- interrupt 2 -->
      <div class="msg bot">
        <div class="who-av">F</div>
        <div class="body" style="width:100%">
          <p>Checked your connections:</p>
          <div class="interrupt">
            <div class="ihead"><span>Paused · missing credential</span><span>interrupt: missing_connection</span></div>
            <div class="ibody">
              <div class="row" style="gap:10px; padding:6px 0">
                <span class="badge ok"><span class="dot"></span>ok</span>
                <b>github</b><span class="faint">connected 12 Aug, last used 2h ago</span>
              </div>
              <div class="row" style="gap:10px; padding:6px 0 12px">
                <span class="badge danger">missing</span>
                <b>slack</b><span class="faint">you have no Slack credential in this workspace</span>
              </div>
              <hr class="sep" style="margin:4px 0 12px">
              <p style="margin:0 0 10px" class="muted">Add one to carry on. It is encrypted when you
              save it and is never written into the agent's configuration.</p>
              <div class="row">
                <button class="btn primary sm">Connect Slack</button>
                <button class="btn sm">Skip &mdash; build without posting</button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 4 -->
      <div class="msg user"><div class="body">Connected.</div></div>

      <!-- result -->
      <div class="msg bot">
        <div class="who-av">F</div>
        <div class="body" style="width:100%">
          <p>Built and deployed. Here it is:</p>

          <div class="card" style="max-width:520px">
            <div class="between" style="margin-bottom:8px">
              <div style="font-weight:650; font-size:15px">Issue Digest</div>
              <span class="badge ok"><span class="dot"></span>live</span>
            </div>
            <div class="muted" style="font-size:13px; margin-bottom:12px">
              Triages open GitHub issues by severity and posts a morning digest to Slack.
            </div>

            <dl class="kv" style="grid-template-columns:118px 1fr; font-size:12.5px">
              <dt>Shape</dt><dd>Coordinator with 2 specialists <span class="badge accent">multi-agent</span></dd>
              <dt>Tools</dt><dd>
                <span class="chip">github.list_issues</span>
                <span class="chip">github.get_issue</span>
                <span class="chip">slack.post_message</span>
              </dd>
              <dt>Approvals</dt><dd>Asks before posting to Slack</dd>
              <dt>Schedule</dt><dd>Weekdays 08:00</dd>
              <dt>Score</dt><dd class="row" style="gap:7px">
                <span class="faint">not tested yet</span>
                <span class="grade c">C</span>
              </dd>
            </dl>

            <hr class="sep">
            <div class="row">
              <a class="btn primary sm" href="agent.html?id=a1&tab=playground">Open the playground</a>
              <a class="btn sm" href="my-agents.html">Go to My Agents</a>
            </div>
          </div>

          <p class="muted" style="margin-top:12px; font-size:12.5px">
            It scores <b>C</b> until you have actually run it. Test it in the playground &mdash;
            the score climbs, and you cannot publish below a B.
          </p>
        </div>
      </div>

     </div>

     <div class="composer">
       <input placeholder="Ask for a change — &ldquo;also include issues labelled bug&rdquo;">
       <button class="btn primary sm">Send</button>
     </div>
    </div>

    <!-- builder progress -->
    <div class="steps">
      <div class="section-title" style="margin-top:0">Builder graph</div>
      ${steps.map(s => `
        <div class="step ${s.s}">
          <div class="n">${s.n}</div>
          <div><div class="lb">${s.lb}</div><div class="sd">${s.sd}</div></div>
        </div>`).join("")}
      ${Forge.reqPanel([
        "A chat that turns a plain-English request into a deployed agent.",
        "It <b>searches your MCP registry</b> and shows the servers it thinks are needed. The user picks.",
        "It <b>checks the user's connections</b> and stops if one is missing, with a way to add it.",
        "Both stops are real LangGraph <b>interrupts</b>. Close the tab, restart the server, come back tomorrow &mdash; the build resumes exactly here.",
        "A form mode that fills in the same steps. Both paths must produce the same agent configuration &mdash; do not write the builder twice.",
        "When it finishes, show the built agent as a card."
      ], "What you must build on this screen")}
    </div>
   </div>
  </div>`;
</script>
</body>
</html>

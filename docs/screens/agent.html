<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Issue Digest — Forge</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .two { display: grid; grid-template-columns: 1fr 300px; gap: 26px; align-items: start; }
  @media (max-width: 980px) { .two { grid-template-columns: 1fr; } }
  .approval {
    border: 1px solid var(--warn); border-radius: 10px; overflow: hidden; max-width: 620px;
  }
  .approval .ah {
    background: var(--warn-bg); color: var(--warn); padding: 8px 14px;
    font-size: 11.5px; font-weight: 650; text-transform: uppercase; letter-spacing: .05em;
  }
  .approval .ab { padding: 13px 14px; background: var(--surface); }
</style>
</head>
<body>
<div class="mockbar" id="mockbar"></div>
<div class="app">
  <nav class="sidebar" id="sidebar"></nav>
  <div class="main" id="main"></div>
</div>

<script src="../assets/data.js"></script>
<script src="../assets/app.js"></script>
<script>
Forge.shell("my-agents", { build: "One agent, in full. Test it here, then publish it." });

const REQ = {
  overview: ["Show the agent's <b>graph, drawn from its configuration</b> — not a hand-maintained picture.",
             "List every tool with its risk level and whether it asks before running.",
             "Show both scores, and <b>show the checks behind them</b>. A student must be able to say why the number is what it is."],
  playground: ["A chat window where the user tests the agent.",
               "When a risky tool is reached, the run <b>pauses and shows Approve / Reject in the chat</b>. Nothing happens until someone clicks.",
               "This pause must survive a restart — the approval is still waiting when the server comes back.",
               "Thumbs up/down feeds the score."],
  connections: ["Show which of the user's connections this agent uses, and whether each is healthy.",
                "The agent's configuration must only say <b>&ldquo;needs a Slack connection&rdquo;</b> — never which one, never the secret.",
                "Revoking a connection leaves the agent <b>degraded</b>, not crashed."],
  runs: ["A run history with status, latency, cost and outcome.",
         "These numbers feed the agent score."],
  api: ["Every agent gets a <b>callable URL</b>.",
        "A <b>Download Postman Collection</b> button. Download it, hit Send, get a real response.",
        "A token from another company calling this URL gets <b>404, not 403</b> — a 403 confirms the agent exists."],
  settings: ["Publishing is <b>blocked</b> below the score threshold, and the button says why.",
             "A score that blocks nothing is decoration.",
             "Publishing strips out everything internal to the company before it leaves."]
};

const a   = DATA.agents.find(x => x.id === Forge.param("id", "a1")) || DATA.agents[0];
const tab = Forge.param("tab", "overview");
const TABS = [
  ["overview",    "Overview"],
  ["playground",  "Playground"],
  ["connections", "Connections"],
  ["runs",        "Runs"],
  ["api",         "API"],
  ["settings",    "Settings"]
];

/* ------------------------------------------------------------------ graph */

/* ------------------------------------------------------------------ tabs */

T.api = `
<div style="max-width:820px">
  <div class="section-title" style="margin-top:0">Endpoint</div>
  <div class="card">

/* ------------------------------------------------------------------ render */
document.getElementById("main").innerHTML =
  Forge.topbar(
    `<span class="row" style="gap:9px">${a.name} ${Forge.statusBadge(a.status)}</span>`,
    a.desc,
    `<a class="btn" href="my-agents.html">← My Agents</a>
     <a class="btn primary" href="agent.html?id=${a.id}&tab=playground">Open playground</a>`
  ) +
  `<div class="tabs">
     ${TABS.map(([k, l]) =>
       `<a class="tab ${k === tab ? "active" : ""}" href="agent.html?id=${a.id}&tab=${k}">${l}</a>`
     ).join("")}
   </div>
   <div class="content">
     ${Forge.reqPanel(REQ[tab] || REQ.overview)}
     <div style="height:20px"></div>
     ${T[tab] || T.overview}
   </div>`;

/* live Postman export, so students can see the artifact they must produce */
const dl = document.getElementById("dl");
if (dl) dl.onclick = () => {
  const req = (name, path, body) => ({
    name,
    request: {
      method: "POST",
      header: [
        { key: "Authorization", value: "Bearer {{token}}" },
        { key: "Content-Type",  value: "application/json" }
      ],
      url: { raw: `{{base_url}}${path}`, host: ["{{base_url}}"], path: path.slice(1).split("/") },
      body: { mode: "raw", raw: JSON.stringify(body, null, 2) }
    }
  });
  const collection = {
    info: {
      name: `Forge — ${a.name}`,
      description: a.desc,
      schema: "https://schema.getpostman.com/json/collection/v2.1.0/collection.json"
    },
    variable: [
      { key: "base_url", value: "http://localhost:8000" },
      { key: "token",    value: "PASTE_YOUR_TOKEN" }
    ],
    item: [
      req("Invoke", `/v1/agents/${a.id}/invoke`, { input: "Run today's digest for the platform repo" }),
      req("Stream", `/v1/agents/${a.id}/stream`, { input: "Run today's digest" }),
      req("Resume approval", `/v1/agents/${a.id}/resume`,
          { thread_id: "thr_8f21c4", decision: "approve" })
    ]
  };
  const url = URL.createObjectURL(
    new Blob([JSON.stringify(collection, null, 2)], { type: "application/json" })
  );
  const el = document.createElement("a");
  el.href = url;
  el.download = `${a.name.toLowerCase().replace(/\s+/g, "-")}.postman_collection.json`;
  el.click();
  URL.revokeObjectURL(url);
};
</script>
</body>
</html>
